name: tests
# Quick suite on every pull request and push to main / release branches (see CONTRIBUTING.md).
on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
    inputs:
      suite: { description: 'quick or release', default: 'quick' }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Run
        run: bash tests/run.sh ${{ github.event.inputs.suite || 'quick' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-output, path: tests/out/ }
