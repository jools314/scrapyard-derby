# R2-79: CI for the single-file game. There is no build step — index.html IS the
# product — so CI runs the checks that exist: the round-2 suite (which node --checks
# the module script, verifies every R2 item's wiring, and executes both tools on
# fixtures) and the announcer lines audit. The browser smoke test runs as an
# advisory step: headless WebGL in CI is environment-dependent, so it reports but
# does not gate (run it locally before a release — see TESTING.md).
#
# PARKED, NOT LIVE: this file sits at ci/github-ci.yml because the token that
# pushed this branch lacks GitHub's `workflow` OAuth scope, and GitHub refuses
# workflow files from such tokens. To activate: `gh auth refresh -s workflow`
# (or use a token that has it), then `git mv ci/github-ci.yml .github/workflows/ci.yml`
# and push. The content needs no changes.
name: ci
on:
  push:
    branches: [main, 'bob/**']
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Round-2 test suite (syntax + per-item wiring + tool fixtures)
        run: node tests/round2.test.mjs
      - name: Announcer lines audit
        run: node tools/lines-audit.mjs
      - name: Browser smoke test (advisory)
        continue-on-error: true
        run: node tests/smoke.mjs --secs=20
