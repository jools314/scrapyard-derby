<script>

// Why: when a page crashes or runs out of memory ('Aw, Snap'), none of its own code runs again and the tab sits dead until a
// person reloads it (the Chromebook, Build 105, overnight). This page runs the game in a sandboxed iframe without
// allow-same-origin: Chrome (site isolation on desktop and ChromeOS) gives such a frame a process of its own, so the game's
// crash takes only the frame. This page stays alive, notices the game's heartbeat (every 5 s) has stopped, and starts a new
// game. It also starts a new one when the game's frames stop for 90 s during autoplay (a hung page), and whenever the game asks
// to reload itself (an update, a self-heal reload), so each fresh start is a fresh process.
// The frame has no storage of its own: this page passes its localStorage/sessionStorage in through the frame's name and keeps
// every write the game posts back (the bridge at the top of index.html), so the play log, the stop log and settings live here.

    setTimeout(function () { make(why); }, 3000); }; // (a moment for the browser to end the old frame's process, so the new game doesn't land in a hung one)
